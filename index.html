<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZESTMOK</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --board-color: #c8a96e;
    --board-dark: #a07840;
    --board-line: #7a5c30;
    --stone-black: #1a1a1a;
    --stone-white: #f5f0e8;
    --bg: #2b1f0e;
    --panel-bg: rgba(20, 13, 4, 0.75);
    --accent-gold: #d4a843;
    --accent-light: #f0d080;
    --text-primary: #f0dfa8;
    --text-secondary: #a09060;
    --cell-size: 40px;
    --stone-size: 34px;
    --board-size: 15;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Background texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(180,130,50,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 80% 100%, rgba(100,60,10,0.2) 0%, transparent 50%);
    pointer-events: none;
  }

  header {
    text-align: center;
    margin-bottom: 20px;
    position: relative;
    z-index: 1;
  }

  h1 {
    font-family: 'Nanum Myeongjo', serif;
    font-size: 2.8rem;
    font-weight: 800;
    color: var(--accent-gold);
    letter-spacing: 0.12em;
    text-shadow: 0 2px 20px rgba(212,168,67,0.4);
  }

  h1 span {
    font-size: 1rem;
    font-weight: 400;
    color: var(--text-secondary);
    letter-spacing: 0.3em;
    display: block;
    margin-top: 2px;
  }

  .game-layout {
    display: flex;
    align-items: flex-start;
    gap: 24px;
    position: relative;
    z-index: 1;
  }

  /* Side panel */
  .panel {
    width: 200px;
    background: var(--panel-bg);
    border: 1px solid rgba(212,168,67,0.2);
    border-radius: 12px;
    padding: 20px 16px;
    backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .player-card {
    border-radius: 8px;
    padding: 14px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    border: 1px solid transparent;
  }

  .player-card.active {
    border-color: var(--accent-gold);
    background: rgba(212,168,67,0.08);
    box-shadow: 0 0 20px rgba(212,168,67,0.15);
  }

  .player-card.active::before {
    content: '▶';
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--accent-gold);
    font-size: 0.7rem;
    animation: pulse 1s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .player-stone {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: inline-block;
    vertical-align: middle;
    margin-right: 8px;
    position: relative;
    top: -1px;
  }

  .player-stone.black {
    background: radial-gradient(circle at 35% 30%, #555, #1a1a1a);
    box-shadow: 0 2px 6px rgba(0,0,0,0.8), inset 0 1px 2px rgba(255,255,255,0.15);
  }

  .player-stone.white {
    background: radial-gradient(circle at 35% 30%, #fff, #d8d0c0);
    box-shadow: 0 2px 6px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.8);
  }

  .player-name {
    font-family: 'Nanum Myeongjo', serif;
    font-size: 1rem;
    font-weight: 700;
    color: var(--text-primary);
  }

  .player-label {
    font-size: 0.72rem;
    color: var(--text-secondary);
    letter-spacing: 0.1em;
    margin-top: 2px;
  }

  .divider {
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(212,168,67,0.3), transparent);
  }

  .score-section {
    text-align: center;
  }

  .score-label {
    font-size: 0.7rem;
    color: var(--text-secondary);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .score-row {
    display: flex;
    justify-content: space-around;
    align-items: center;
  }

  .score-val {
    font-family: 'Nanum Myeongjo', serif;
    font-size: 1.8rem;
    font-weight: 800;
    color: var(--accent-gold);
  }

  .score-separator {
    color: var(--text-secondary);
    font-size: 1rem;
  }

  .btn {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--accent-gold);
    background: transparent;
    color: var(--accent-gold);
    font-family: 'Nanum Myeongjo', serif;
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn:hover {
    background: var(--accent-gold);
    color: var(--bg);
    box-shadow: 0 0 20px rgba(212,168,67,0.4);
  }

  .btn:active { transform: scale(0.97); }

  .btn.secondary {
    border-color: rgba(212,168,67,0.3);
    color: var(--text-secondary);
    font-size: 0.8rem;
  }

  .btn.secondary:hover {
    background: rgba(212,168,67,0.1);
    color: var(--text-primary);
    box-shadow: none;
  }

  /* Board container */
  .board-wrap {
    position: relative;
    padding: 24px;
    background: var(--panel-bg);
    border: 1px solid rgba(212,168,67,0.2);
    border-radius: 12px;
    backdrop-filter: blur(6px);
  }

  .board-surface {
    position: relative;
    background:
      linear-gradient(135deg, #d4aa6a 0%, #b8893e 30%, #c9a158 60%, #a07030 100%);
    border-radius: 4px;
    box-shadow:
      0 8px 40px rgba(0,0,0,0.6),
      inset 0 1px 3px rgba(255,255,255,0.2),
      inset 0 -2px 6px rgba(0,0,0,0.3);
  }

  /* Wood grain overlay */
  .board-surface::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 4px;
    background: repeating-linear-gradient(
      170deg,
      transparent,
      transparent 8px,
      rgba(0,0,0,0.025) 8px,
      rgba(0,0,0,0.025) 9px
    );
    pointer-events: none;
  }

  #board-canvas {
    display: block;
  }

  /* Stones overlay */
  .stones-layer {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
  }

  .stone {
    position: absolute;
    width: var(--stone-size);
    height: var(--stone-size);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: transform 0.05s;
    animation: placeStone 0.18s cubic-bezier(0.34,1.56,0.64,1) forwards;
  }

  @keyframes placeStone {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0.6; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  }

  .stone.winning {
    animation: winPulse 0.6s ease-in-out infinite alternate;
  }

  @keyframes winPulse {
    0% { box-shadow: 0 3px 10px rgba(0,0,0,0.7), 0 0 0 0 rgba(255,220,50,0.8); }
    100% { box-shadow: 0 3px 10px rgba(0,0,0,0.7), 0 0 0 8px rgba(255,220,50,0); }
  }

  .stone.last-placed::after {
    content: '';
    position: absolute;
    inset: 30%;
    border-radius: 50%;
    background: rgba(255,100,50,0.8);
  }

  /* Hover ghost stone */
  .ghost-stone {
    position: absolute;
    width: var(--stone-size);
    height: var(--stone-size);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    opacity: 0.35;
    transition: left 0.05s, top 0.05s;
    display: none;
  }

  /* Overlay modal */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,5,0,0.75);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .overlay.show {
    opacity: 1;
    pointer-events: all;
  }

  .modal {
    background: linear-gradient(160deg, #2a1c0a, #1a1005);
    border: 1px solid var(--accent-gold);
    border-radius: 16px;
    padding: 40px 48px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(212,168,67,0.15);
    transform: scale(0.85);
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }

  .overlay.show .modal {
    transform: scale(1);
  }

  .modal-stone {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: winBounce 0.6s cubic-bezier(0.34,1.56,0.64,1);
  }

  @keyframes winBounce {
    0% { transform: scale(0) rotate(-30deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  .modal-title {
    font-family: 'Nanum Myeongjo', serif;
    font-size: 1.1rem;
    color: var(--text-secondary);
    letter-spacing: 0.2em;
    margin-bottom: 4px;
  }

  .modal-winner {
    font-family: 'Nanum Myeongjo', serif;
    font-size: 2rem;
    font-weight: 800;
    color: var(--accent-gold);
    margin-bottom: 8px;
    text-shadow: 0 2px 20px rgba(212,168,67,0.5);
  }

  .modal-sub {
    font-size: 0.85rem;
    color: var(--text-secondary);
    margin-bottom: 28px;
  }

  .modal-btns {
    display: flex;
    gap: 10px;
    justify-content: center;
  }

  .modal-btns .btn {
    width: auto;
    padding: 10px 24px;
  }

  /* Turn indicator */
  .turn-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: center;
    margin-top: 10px;
    font-size: 0.8rem;
    color: var(--text-secondary);
    letter-spacing: 0.1em;
  }

  .turn-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    transition: background 0.3s;
  }

  /* Clickable board area */
  .board-click {
    position: absolute;
    top: 0; left: 0;
    cursor: pointer;
  }

  /* Color selection overlay */
  .select-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,5,0,0.85);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .select-overlay.show { opacity: 1; pointer-events: all; }
  .select-modal {
    background: linear-gradient(160deg, #2a1c0a, #1a1005);
    border: 1px solid var(--accent-gold);
    border-radius: 16px;
    padding: 36px 44px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(212,168,67,0.15);
    transform: scale(0.85);
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    min-width: 320px;
  }
  .select-overlay.show .select-modal { transform: scale(1); }
  .select-title {
    font-family: 'Nanum Myeongjo', serif;
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--accent-gold);
    margin-bottom: 6px;
    letter-spacing: 0.08em;
  }
  .select-sub {
    font-size: 0.8rem;
    color: var(--text-secondary);
    letter-spacing: 0.12em;
    margin-bottom: 28px;
  }
  .stone-choices { display: flex; gap: 20px; justify-content: center; margin-bottom: 8px; }
  .stone-choice {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    padding: 18px 24px;
    border-radius: 12px;
    border: 2px solid transparent;
    transition: all 0.2s ease;
    background: rgba(255,255,255,0.03);
  }
  .stone-choice:hover {
    border-color: var(--accent-gold);
    background: rgba(212,168,67,0.08);
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(212,168,67,0.15);
  }
  .stone-choice-img {
    width: 72px; height: 72px;
    border-radius: 50%;
    object-fit: cover;
    object-position: center top;
    box-shadow: 0 4px 16px rgba(0,0,0,0.6);
    border: 3px solid rgba(212,168,67,0.4);
    transition: all 0.2s;
  }
  .stone-choice:hover .stone-choice-img {
    border-color: var(--accent-gold);
    box-shadow: 0 4px 24px rgba(212,168,67,0.4);
  }
  .stone-choice-label { font-family: 'Nanum Myeongjo', serif; font-size: 0.95rem; font-weight: 700; color: var(--text-primary); letter-spacing: 0.08em; }
  .stone-choice-tag { font-size: 0.7rem; color: var(--text-secondary); letter-spacing: 0.1em; }
  .ai-thinking {
    display: none; align-items: center; gap: 6px;
    justify-content: center; margin-top: 8px;
    font-size: 0.78rem; color: var(--accent-gold); letter-spacing: 0.1em;
  }
  .ai-thinking.show { display: flex; }
  .ai-dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent-gold);
    animation: aiPulse 1.2s ease-in-out infinite;
  }
  .ai-dot:nth-child(2) { animation-delay: 0.2s; }
  .ai-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes aiPulse {
    0%, 60%, 100% { transform: scale(1); opacity: 0.4; }
    30% { transform: scale(1.4); opacity: 1; }
  }
  .player-badge {
    display: inline-block; font-size: 0.6rem; font-weight: 600;
    letter-spacing: 0.12em; padding: 2px 6px; border-radius: 4px;
    margin-left: 4px; vertical-align: middle;
  }
  .badge-human { background: rgba(212,168,67,0.2); color: var(--accent-gold); border: 1px solid rgba(212,168,67,0.4); }
  .badge-ai { background: rgba(100,180,255,0.15); color: #6ab4ff; border: 1px solid rgba(100,180,255,0.3); }

  /* Mode selection overlay */
  .mode-overlay {
    position: fixed; inset: 0;
    background: rgba(10,5,0,0.92);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    z-index: 300; opacity: 0; pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .mode-overlay.show { opacity: 1; pointer-events: all; }
  .mode-modal {
    background: linear-gradient(160deg, #2a1c0a, #1a1005);
    border: 1px solid var(--accent-gold);
    border-radius: 16px;
    padding: 40px 48px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(212,168,67,0.15);
    transform: scale(0.85);
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    min-width: 340px;
  }
  .mode-overlay.show .mode-modal { transform: scale(1); }
  .mode-title {
    font-family: 'Nanum Myeongjo', serif;
    font-size: 1.8rem; font-weight: 800;
    color: var(--accent-gold); margin-bottom: 4px; letter-spacing: 0.08em;
  }
  .mode-subtitle { font-size: 0.78rem; color: var(--text-secondary); letter-spacing: 0.15em; margin-bottom: 32px; }
  .mode-cards { display: flex; gap: 16px; justify-content: center; }
  .mode-card {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    cursor: pointer; padding: 20px 20px; border-radius: 12px;
    border: 2px solid rgba(212,168,67,0.2);
    background: rgba(255,255,255,0.03);
    transition: all 0.2s ease; width: 130px;
  }
  .mode-card:hover {
    border-color: var(--accent-gold);
    background: rgba(212,168,67,0.08);
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(212,168,67,0.2);
  }
  .mode-icon { font-size: 2.4rem; line-height: 1; }
  .mode-card-title { font-family: 'Nanum Myeongjo', serif; font-size: 1rem; font-weight: 700; color: var(--text-primary); }
  .mode-card-desc { font-size: 0.68rem; color: var(--text-secondary); letter-spacing: 0.08em; line-height: 1.4; text-align: center; }

  /* Room overlay */
  .room-overlay {
    position: fixed; inset: 0;
    background: rgba(10,5,0,0.92);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    z-index: 300; opacity: 0; pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .room-overlay.show { opacity: 1; pointer-events: all; }
  .room-modal {
    background: linear-gradient(160deg, #2a1c0a, #1a1005);
    border: 1px solid var(--accent-gold);
    border-radius: 16px; padding: 36px 44px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(212,168,67,0.15);
    transform: scale(0.85);
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    min-width: 320px;
  }
  .room-overlay.show .room-modal { transform: scale(1); }
  .room-title { font-family: 'Nanum Myeongjo', serif; font-size: 1.4rem; font-weight: 800; color: var(--accent-gold); margin-bottom: 6px; }
  .room-subtitle { font-size: 0.78rem; color: var(--text-secondary); letter-spacing: 0.1em; margin-bottom: 24px; }
  .room-tabs { display: flex; gap: 0; margin-bottom: 24px; border: 1px solid rgba(212,168,67,0.3); border-radius: 8px; overflow: hidden; }
  .room-tab {
    flex: 1; padding: 10px; font-family: 'Nanum Myeongjo', serif; font-size: 0.9rem; font-weight: 700;
    background: transparent; border: none; color: var(--text-secondary); cursor: pointer;
    transition: all 0.2s;
  }
  .room-tab.active { background: rgba(212,168,67,0.15); color: var(--accent-gold); }
  .room-panel { display: none; }
  .room-panel.active { display: block; }
  .room-code-box {
    background: rgba(0,0,0,0.4);
    border: 2px solid var(--accent-gold);
    border-radius: 10px; padding: 16px 24px;
    font-family: 'Nanum Myeongjo', serif; font-size: 2.4rem;
    font-weight: 800; color: var(--accent-gold);
    letter-spacing: 0.25em; text-align: center;
    margin-bottom: 10px; cursor: pointer;
    transition: all 0.2s;
  }
  .room-code-box:hover { background: rgba(212,168,67,0.08); }
  .room-code-hint { font-size: 0.72rem; color: var(--text-secondary); margin-bottom: 20px; }
  .room-code-hint span { color: var(--accent-gold); }
  .room-waiting { display: flex; align-items: center; gap: 6px; justify-content: center; font-size: 0.8rem; color: var(--text-secondary); margin-top: 8px; }
  .room-input {
    width: 100%; padding: 12px 16px; margin-bottom: 16px;
    background: rgba(0,0,0,0.4); border: 1px solid rgba(212,168,67,0.4);
    border-radius: 8px; color: var(--text-primary);
    font-family: 'Nanum Myeongjo', serif; font-size: 1.6rem;
    font-weight: 800; letter-spacing: 0.3em; text-align: center;
    text-transform: uppercase; outline: none;
    transition: border-color 0.2s;
  }
  .room-input:focus { border-color: var(--accent-gold); }
  .room-input::placeholder { color: rgba(160,144,96,0.4); font-size: 1.2rem; letter-spacing: 0.1em; }
  .room-status { font-size: 0.78rem; margin-bottom: 12px; min-height: 20px; }
  .room-status.ok { color: #6dcc8a; }
  .room-status.err { color: #ff7070; }
  .back-btn { font-size: 0.75rem; color: var(--text-secondary); background: none; border: none; cursor: pointer; margin-top: 12px; text-decoration: underline; }
  .back-btn:hover { color: var(--text-primary); }
  /* Online game badge */
  .online-badge {
    display: inline-block; font-size: 0.6rem; font-weight: 600; letter-spacing: 0.12em;
    padding: 2px 6px; border-radius: 4px; margin-left: 4px; vertical-align: middle;
    background: rgba(100,220,120,0.15); color: #6dcc8a; border: 1px solid rgba(100,220,120,0.3);
  }
  .conn-status {
    display: flex; align-items: center; gap: 5px;
    font-size: 0.7rem; justify-content: center; margin-top: 6px;
  }
  .conn-dot { width: 7px; height: 7px; border-radius: 50%; background: #6dcc8a; animation: connPulse 2s ease-in-out infinite; }
  .conn-dot.offline { background: #ff7070; animation: none; }
  @keyframes connPulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
</style>

let scores = {1: 0, 2: 0};
let lastPlaced = null;
let winningCells = [];
let humanPlayer = 1;
let aiPlayer = 2;
let aiThinking = false;

// Game mode: 'ai' | 'online'
let gameMode = 'ai';
// Online: 'host' | 'guest'
let onlineRole = null;
let peer = null;
let conn = null;
let myOnlinePlayer = 1; // in online mode

const stoneImgs = {};
(function() {
  const tmpDiv = document.createElement('div');
  tmpDiv.className = 'stone black-stone';
  tmpDiv.style.cssText = 'position:absolute;left:-9999px;width:1px;height:1px';
  document.body.appendChild(tmpDiv);
  const blackBg = getComputedStyle(tmpDiv).backgroundImage;
  tmpDiv.className = 'stone white-stone';
  const whiteBg = getComputedStyle(tmpDiv).backgroundImage;
  document.body.removeChild(tmpDiv);
  function extractUrl(bg) { return bg.replace(/^url\(["']?/, '').replace(/["']?\)$/, ''); }
  stoneImgs[1] = extractUrl(blackBg);
  stoneImgs[2] = extractUrl(whiteBg);
  document.getElementById('choice-black-img').src = stoneImgs[1];
  document.getElementById('choice-white-img').src = stoneImgs[2];
})();

const canvas = document.getElementById('board-canvas');
const clickCanvas = document.getElementById('board-click');
const stonesLayer = document.getElementById('stones-layer');
const ghost = document.getElementById('ghost-stone');

canvas.width = clickCanvas.width = CANVAS_SIZE;
canvas.height = clickCanvas.height = CANVAS_SIZE;
document.getElementById('board-surface').style.width = CANVAS_SIZE + 'px';
document.getElementById('board-surface').style.height = CANVAS_SIZE + 'px';
stonesLayer.style.width = CANVAS_SIZE + 'px';
stonesLayer.style.height = CANVAS_SIZE + 'px';
ghost.style.width = ghost.style.height = STONE_R * 2 + 'px';
clickCanvas.style.width = clickCanvas.style.height = CANVAS_SIZE + 'px';
clickCanvas.style.position = 'absolute';
clickCanvas.style.top = '0'; clickCanvas.style.left = '0';
clickCanvas.style.opacity = '0';

// ─── MODE SELECTION ───────────────────────────────────────────
function selectMode(mode) {
  gameMode = mode;
  hideOverlay('mode-overlay');
  if (mode === 'ai') {
    showOverlay('select-overlay');
  } else {
    showOverlay('room-overlay');
    initRoomOverlay();
  }
}

function backToModeSelect() {
  destroyPeer();
  hideOverlay('room-overlay');
  showOverlay('mode-overlay');
}

function showOverlay(id) { document.getElementById(id).classList.add('show'); }
function hideOverlay(id) { document.getElementById(id).classList.remove('show'); }

// ─── ROOM SYSTEM ──────────────────────────────────────────────
function generateCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}

function switchTab(tab) {
  document.getElementById('tab-create').classList.toggle('active', tab === 'create');
  document.getElementById('tab-join').classList.toggle('active', tab === 'join');
  document.getElementById('panel-create').classList.toggle('active', tab === 'create');
  document.getElementById('panel-join').classList.toggle('active', tab === 'join');
  if (tab === 'create') initCreateRoom();
  else destroyPeer();
}

function initRoomOverlay() {
  switchTab('create');
}

function initCreateRoom() {
  destroyPeer();
  const code = generateCode();
  document.getElementById('room-code-display').textContent = code;
  document.getElementById('create-status-text').textContent = '상대방을 기다리는 중...';
  // PeerJS: use code as peer ID
  const peerId = 'gomoku-' + code;
  peer = new Peer(peerId, {debug: 0});
  peer.on('open', () => {});
  peer.on('connection', (c) => {
    conn = c;
    setupConn();
    onlineRole = 'host';
    myOnlinePlayer = 1;
    document.getElementById('create-status-text').textContent = '상대방이 연결되었습니다!';
    setTimeout(() => {
      hideOverlay('room-overlay');
      startOnlineGame();
    }, 800);
  });
  peer.on('error', (err) => {
    document.getElementById('create-status-text').textContent = '오류: ' + err.type;
  });
}

function joinRoom() {
  const rawCode = document.getElementById('join-code-input').value.trim().toUpperCase();
  if (rawCode.length !== 4) {
    setJoinStatus('4자리 코드를 입력하세요', 'err');
    return;
  }
  setJoinStatus('연결 중...', '');
  destroyPeer();
  peer = new Peer(undefined, {debug: 0});
  peer.on('open', () => {
    conn = peer.connect('gomoku-' + rawCode, {reliable: true});
    conn.on('open', () => {
      setupConn();
      onlineRole = 'guest';
      myOnlinePlayer = 2;
      setJoinStatus('연결 성공!', 'ok');
      setTimeout(() => {
        hideOverlay('room-overlay');
        startOnlineGame();
      }, 500);
    });
    conn.on('error', () => setJoinStatus('연결 실패. 코드를 확인하세요.', 'err'));
  });
  peer.on('error', () => setJoinStatus('연결 실패. 코드를 확인하세요.', 'err'));
}

function setupConn() {
  conn.on('data', onReceiveData);
  conn.on('close', () => {
    setConnStatus(false);
  });
}

function onReceiveData(data) {
  if (data.type === 'move') {
    doPlaceStone(data.row, data.col, false);
  } else if (data.type === 'restart') {
    remoteRequestedRestart = true;
    doNewOnlineGame();
  }
}

function sendMove(row, col) {
  if (conn && conn.open) conn.send({type: 'move', row, col});
}

function copyRoomCode() {
  const code = document.getElementById('room-code-display').textContent;
  if (code === '----') return;
  navigator.clipboard.writeText(code).then(() => {
    const el = document.getElementById('room-code-display');
    const orig = el.textContent;
    el.textContent = '복사됨!';
    setTimeout(() => el.textContent = orig, 1200);
  }).catch(() => {});
}

function setJoinStatus(msg, type) {
  const el = document.getElementById('join-status');
  el.textContent = msg;
  el.className = 'room-status' + (type ? ' ' + type : '');
}

function setConnStatus(online) {
  const s = document.getElementById('conn-status');
  const d = document.getElementById('conn-dot');
  const t = document.getElementById('conn-text');
  s.style.display = 'flex';
  d.className = 'conn-dot' + (online ? '' : ' offline');
  t.textContent = online ? '연결됨' : '상대방 연결 끊김';
}

function destroyPeer() {
  if (conn) { try { conn.close(); } catch(e){} conn = null; }
  if (peer) { try { peer.destroy(); } catch(e){} peer = null; }
}

let remoteRequestedRestart = false;

function startOnlineGame() {
  // host=black(1), guest=white(2)
  humanPlayer = myOnlinePlayer;
  aiPlayer = myOnlinePlayer === 1 ? 2 : 1;
  setConnStatus(true);
  updateOnlineBadges();
  document.getElementById('conn-status').style.display = 'flex';
  gameOver = false;
  currentPlayer = 1;
  initBoard();
  updateTurn();
  setAiThinking(false);
}

  const nBlack = document.getElementById('name-black');
  const nWhite = document.getElementById('name-white');
  const lBlack = document.getElementById('label-black');
  const lWhite = document.getElementById('label-white');
  if (myOnlinePlayer === 1) {
    nBlack.innerHTML = 'ZEST <span class="player-badge badge-human" id="badge-black">YOU</span>';
    nWhite.innerHTML = 'ZAIST <span class="player-badge online-badge" id="badge-white">ONLINE</span>';
  } else {
    nBlack.innerHTML = 'ZAIST <span class="player-badge online-badge" id="badge-black">ONLINE</span>';
    nWhite.innerHTML = 'ZEST <span class="player-badge badge-human" id="badge-white">YOU</span>';
  }
  lBlack.textContent = 'BLACK · FIRST';
  lWhite.textContent = 'WHITE · SECOND';
}

// ─── COLOR SELECTION (AI MODE) ────────────────────────────────
function selectColor(color) {
  humanPlayer = color;
  aiPlayer = color === 1 ? 2 : 1;
  hideOverlay('select-overlay');
  updateBadges();
  gameOver = false;
  aiThinking = false;
  currentPlayer = 1;
  document.getElementById('conn-status').style.display = 'none';

  const lBlack = document.getElementById('label-black');
  const lWhite = document.getElementById('label-white');

  } else {
    nBlack.innerHTML = 'ZAIST <span class="player-badge badge-ai" id="badge-black">AI</span>';

// ─── BOARD ────────────────────────────────────────────────────
function initBoard() {
  board = Array.from({length: BOARD_SIZE}, () => Array(BOARD_SIZE).fill(0));
  lastPlaced = null; winningCells = [];
  stonesLayer.innerHTML = '';
  stonesLayer.appendChild(ghost);
  drawBoard();
}

function drawBoard() {
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
  ctx.strokeStyle = '#7a5c30'; ctx.lineWidth = 1;
  for (let i = 0; i < BOARD_SIZE; i++) {
    const x = MARGIN+i*CELL, y = MARGIN+i*CELL;
    ctx.beginPath(); ctx.moveTo(x, MARGIN); ctx.lineTo(x, MARGIN+(BOARD_SIZE-1)*CELL); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(MARGIN, y); ctx.lineTo(MARGIN+(BOARD_SIZE-1)*CELL, y); ctx.stroke();
  }
  const stars = [[3,3],[3,11],[7,7],[11,3],[11,11]];
  ctx.fillStyle = '#5c3f18';
  for (const [r,c] of stars) { ctx.beginPath(); ctx.arc(MARGIN+c*CELL, MARGIN+r*CELL, 4, 0, Math.PI*2); ctx.fill(); }
  ctx.fillStyle = 'rgba(90,60,20,0.7)';
  ctx.font = '11px "Noto Sans KR", sans-serif'; ctx.textAlign = 'center';
  const cols = 'ABCDEFGHJKLMNOP';
  for (let i = 0; i < BOARD_SIZE; i++) {
    ctx.fillText(cols[i], MARGIN+i*CELL, 14);
    ctx.fillText(cols[i], MARGIN+i*CELL, CANVAS_SIZE-6);
    ctx.textAlign='right'; ctx.fillText(BOARD_SIZE-i, MARGIN-8, MARGIN+i*CELL+4);
    ctx.textAlign='left'; ctx.fillText(BOARD_SIZE-i, MARGIN+(BOARD_SIZE-1)*CELL+10, MARGIN+i*CELL+4);
    ctx.textAlign='center';
  }
}

function colRowFromXY(x, y) {
  const col = Math.round((x-MARGIN)/CELL), row = Math.round((y-MARGIN)/CELL);
  if (col<0||col>=BOARD_SIZE||row<0||row>=BOARD_SIZE) return null;
  const cx=MARGIN+col*CELL, cy=MARGIN+row*CELL;
  if (Math.abs(x-cx)>CELL*0.5||Math.abs(y-cy)>CELL*0.5) return null;
  return {row, col};
}

function addStoneElement(row, col, player, isLast, isWin) {
  const el = document.createElement('div');
  el.className = `stone ${player===1?'black-stone':'white-stone'}`;
  el.style.left = (MARGIN+col*CELL)+'px'; el.style.top = (MARGIN+row*CELL)+'px';
  el.dataset.row = row; el.dataset.col = col;
  if (isLast) el.classList.add('last-placed');
  if (isWin) el.classList.add('winning');
  stonesLayer.appendChild(el);
  return el;
}

function refreshStones() {
  stonesLayer.innerHTML = ''; stonesLayer.appendChild(ghost);
  for (let r=0;r<BOARD_SIZE;r++) for (let c=0;c<BOARD_SIZE;c++) if (board[r][c]) {
    const isLast = lastPlaced && lastPlaced.row===r && lastPlaced.col===c;
    const isWin = winningCells.some(([wr,wc])=>wr===r&&wc===c);
    addStoneElement(r, c, board[r][c], isLast, isWin);
  }
}

// ─── PLACING STONES ───────────────────────────────────────────
function handleClick(row, col) {
  if (gameOver || aiThinking) return;
  if (gameMode === 'ai') {
    if (currentPlayer !== humanPlayer) return;
    doPlaceStone(row, col, true);
    if (!gameOver) setTimeout(doAiMove, 350);
  } else {
    // online
    if (currentPlayer !== myOnlinePlayer) return;
    sendMove(row, col);
    doPlaceStone(row, col, false);
  }
}

function doPlaceStone(row, col, triggerAi) {
  if (gameOver || board[row][col] !== 0) return;
  board[row][col] = currentPlayer;
  document.querySelectorAll('.stone.last-placed').forEach(e=>e.classList.remove('last-placed'));
  lastPlaced = {row, col};
  const isWin = checkWin(row, col);
  addStoneElement(row, col, currentPlayer, true, false);
  if (isWin) {
    winningCells = isWin;
    gameOver = true;
    scores[currentPlayer]++;
    updateScores();
    setTimeout(refreshStones, 50);
    setTimeout(()=>showWinOverlay(currentPlayer), 500);
    return;
  }
  if (board.flat().every(v=>v!==0)) {
    gameOver = true;
    setTimeout(()=>showDrawOverlay(), 300);
    return;
  }
  currentPlayer = currentPlayer===1?2:1;
  updateTurn();
}

// ─── AI ───────────────────────────────────────────────────────
function doAiMove() {
  if (gameOver || currentPlayer !== aiPlayer || gameMode !== 'ai') return;
  aiThinking = true; setAiThinking(true);
  setTimeout(()=>{
    const move = getBestMove(aiPlayer);
    aiThinking = false; setAiThinking(false);
    if (move) doPlaceStone(move.row, move.col, false);
  }, 80);
}

function setAiThinking(on) {
  document.getElementById('ai-thinking').classList.toggle('show', on);
  clickCanvas.style.pointerEvents = on ? 'none' : 'auto';
}

function getCandidates() {
  const visited = new Set(), candidates = [];
  let hasPiece = false;
  for (let r=0;r<BOARD_SIZE;r++) for (let c=0;c<BOARD_SIZE;c++) if (board[r][c]) hasPiece = true;
  if (!hasPiece) return [{row:7,col:7}];
  for (let r=0;r<BOARD_SIZE;r++) for (let c=0;c<BOARD_SIZE;c++) {
    if (!board[r][c]) continue;
    for (let dr=-2;dr<=2;dr++) for (let dc=-2;dc<=2;dc++) {
      const nr=r+dr, nc=c+dc;
      if (nr<0||nr>=BOARD_SIZE||nc<0||nc>=BOARD_SIZE||board[nr][nc]) continue;
      const key=nr*BOARD_SIZE+nc;
      if (!visited.has(key)){visited.add(key); candidates.push({row:nr,col:nc});}
    }
  }
  return candidates;
}

function getBestMove(player) {
  const opponent = player===1?2:1;
  const candidates = getCandidates();
  if (!candidates.length) return {row:7,col:7};
  let bestScore=-Infinity, bestMove=candidates[0];
  for (const {row,col} of candidates) {
    board[row][col]=player;
    const score=evaluateMove(row,col,player,opponent);
    board[row][col]=0;
    if (score>bestScore){bestScore=score;bestMove={row,col};}
  }
  return bestMove;
}

const SCORES={win:1000000,four_open:100000,four_blocked:10000,three_open:5000,three_blocked:500,two_open:200,two_blocked:20,one_open:5};

function countLine(row,col,dr,dc,player) {
  let count=1,openEnds=0;
  let r=row+dr,c=col+dc;
  while(r>=0&&r<BOARD_SIZE&&c>=0&&c<BOARD_SIZE&&board[r][c]===player){count++;r+=dr;c+=dc;}
  if(r>=0&&r<BOARD_SIZE&&c>=0&&c<BOARD_SIZE&&board[r][c]===0)openEnds++;
  r=row-dr;c=col-dc;
  while(r>=0&&r<BOARD_SIZE&&c>=0&&c<BOARD_SIZE&&board[r][c]===player){count++;r-=dr;c-=dc;}
  if(r>=0&&r<BOARD_SIZE&&c>=0&&c<BOARD_SIZE&&board[r][c]===0)openEnds++;
  return{count,openEnds};
}

function scoreForPattern(count,openEnds,isMe){
  if(count>=5)return SCORES.win;
  const m=isMe?1.0:0.95;
  if(count===4)return(openEnds>=1?SCORES.four_open:SCORES.four_blocked)*m;
  if(count===3)return(openEnds>=2?SCORES.three_open:SCORES.three_blocked)*m;
  if(count===2)return(openEnds>=2?SCORES.two_open:SCORES.two_blocked)*m;
  if(count===1)return openEnds>=1?SCORES.one_open*m:0;
  return 0;
}

function evaluateMove(row,col,player,opponent){
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  let total=0;
  for(const[dr,dc]of dirs){
    const myLine=countLine(row,col,dr,dc,player);
    total+=scoreForPattern(myLine.count,myLine.openEnds,true);
    board[row][col]=0; board[row][col]=opponent;
    const oppLine=countLine(row,col,dr,dc,opponent);
    total+=scoreForPattern(oppLine.count,oppLine.openEnds,false);
    board[row][col]=player;
  }
  total+=(14-Math.abs(row-7)-Math.abs(col-7))*0.5;
  return total;
}

// ─── WIN CHECK ────────────────────────────────────────────────
function checkWin(row,col){
  const p=board[row][col];
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(const[dr,dc]of dirs){
    const cells=[[row,col]];
    for(let d=1;d<5;d++){const r=row+dr*d,c=col+dc*d;if(r<0||r>=BOARD_SIZE||c<0||c>=BOARD_SIZE||board[r][c]!==p)break;cells.push([r,c]);}
    for(let d=1;d<5;d++){const r=row-dr*d,c=col-dc*d;if(r<0||r>=BOARD_SIZE||c<0||c>=BOARD_SIZE||board[r][c]!==p)break;cells.push([r,c]);}
    if(cells.length>=5)return cells;
  }
  return null;
}

// ─── UI UPDATES ───────────────────────────────────────────────
function updateTurn(){
  const dot=document.getElementById('turn-dot');
  const text=document.getElementById('turn-text');
  dot.style.background=currentPlayer===1?'#222':'#e8e0d0';
  dot.style.border=currentPlayer===2?'1px solid #999':'none';
  dot.style.boxShadow=currentPlayer===1?'0 0 6px rgba(0,0,0,0.8)':'0 0 6px rgba(255,255,255,0.6)';
  if(gameMode==='ai'){
    const isAiTurn=currentPlayer===aiPlayer;
    const name=currentPlayer===humanPlayer?'ZEST':'ZAIST';
    text.textContent=isAiTurn?`${name} (AI) 차례`:`${name} 차례`;
  } else {
    const isMyTurn=currentPlayer===myOnlinePlayer;
    const name=isMyTurn?'ZEST':'ZAIST';
    text.textContent=isMyTurn?`${name} (나) 차례`:`${name} 차례`;
  }
  document.getElementById('card-black').classList.toggle('active',currentPlayer===1);
  document.getElementById('card-white').classList.toggle('active',currentPlayer===2);
}

function updateScores(){
  document.getElementById('score-black').textContent=scores[1];
  document.getElementById('score-white').textContent=scores[2];
}

function showWinOverlay(player){
  const overlay=document.getElementById('overlay');
  const stone=document.getElementById('modal-stone');
  const winner=document.getElementById('modal-winner');
  const sub=document.getElementById('modal-sub');
  stone.className=`modal-stone ${player===1?'black-stone':'white-stone'}`;
  let isHuman;
  if(gameMode==='ai') isHuman=player===humanPlayer;
  else isHuman=player===myOnlinePlayer;
  winner.textContent=isHuman?'ZEST 승리! 🎉':'ZAIST 승리!';
  sub.textContent=isHuman?'당신이 이겼습니다!':(gameMode==='ai'?'🤖 AI가 이겼습니다':'상대방이 이겼습니다');
  overlay.classList.add('show');
}

function showDrawOverlay(){
  const overlay=document.getElementById('overlay');
  document.getElementById('modal-stone').style.background='linear-gradient(135deg,#222 50%,#ccc 50%)';
  document.getElementById('modal-stone').style.boxShadow='0 4px 20px rgba(0,0,0,0.5)';
  document.getElementById('modal-winner').textContent='무승부!';
  document.getElementById('modal-sub').textContent='보드가 가득 찼습니다';
  overlay.classList.add('show');
}

function closeOverlay(){ document.getElementById('overlay').classList.remove('show'); }

function newGame(){
  closeOverlay();
  destroyPeer();
  document.getElementById('conn-status').style.display='none';
  showOverlay('mode-overlay');
}

function doNewOnlineGame(){
  closeOverlay();
  gameOver=false; aiThinking=false; currentPlayer=1;
  initBoard(); updateTurn(); setAiThinking(false);
}

function resetScore(){ scores={1:0,2:0}; updateScores(); }

// ─── INPUT HANDLING ───────────────────────────────────────────
clickCanvas.addEventListener('mousemove',(e)=>{
  const isMyTurn = gameMode==='ai'?currentPlayer===humanPlayer:currentPlayer===myOnlinePlayer;
  if(gameOver||!isMyTurn||aiThinking){ghost.style.display='none';return;}
  const rect=clickCanvas.getBoundingClientRect();
  const scaleX=CANVAS_SIZE/rect.width,scaleY=CANVAS_SIZE/rect.height;
  const x=(e.clientX-rect.left)*scaleX,y=(e.clientY-rect.top)*scaleY;
  const pos=colRowFromXY(x,y);
  if(pos&&board[pos.row][pos.col]===0){
    ghost.style.display='block';
    ghost.style.left=(MARGIN+pos.col*CELL)+'px';
    ghost.style.top=(MARGIN+pos.row*CELL)+'px';
    const myStone=gameMode==='ai'?humanPlayer:myOnlinePlayer;
    ghost.className=`ghost-stone ${myStone===1?'black-ghost':'white-ghost'}`;
    clickCanvas.style.cursor='pointer';
  } else { ghost.style.display='none'; clickCanvas.style.cursor='default'; }
});

clickCanvas.addEventListener('mouseleave',()=>{ghost.style.display='none';});

clickCanvas.addEventListener('click',(e)=>{
  if(gameOver||aiThinking)return;
  const rect=clickCanvas.getBoundingClientRect();
  const scaleX=CANVAS_SIZE/rect.width,scaleY=CANVAS_SIZE/rect.height;
  const x=(e.clientX-rect.left)*scaleX,y=(e.clientY-rect.top)*scaleY;
  const pos=colRowFromXY(x,y);
  if(pos)handleClick(pos.row,pos.col);
});

clickCanvas.addEventListener('touchend',(e)=>{
  if(gameOver||aiThinking)return;
  e.preventDefault();
  const touch=e.changedTouches[0];
  const rect=clickCanvas.getBoundingClientRect();
  const scaleX=CANVAS_SIZE/rect.width,scaleY=CANVAS_SIZE/rect.height;
  const x=(touch.clientX-rect.left)*scaleX,y=(touch.clientY-rect.top)*scaleY;
  const pos=colRowFromXY(x,y);
  if(pos)handleClick(pos.row,pos.col);
});

// Enter key for room join
document.getElementById('join-code-input').addEventListener('keydown',(e)=>{
  if(e.key==='Enter')joinRoom();
});

function scaleBoard(){
  const maxW=Math.min(window.innerWidth-480,700);
  const maxH=window.innerHeight-200;
  const scale=Math.min(maxW/CANVAS_SIZE,maxH/CANVAS_SIZE,1);
  const surface=document.getElementById('board-surface');
  surface.style.transform=`scale(${scale})`;
  surface.style.transformOrigin='top left';
  document.querySelector('.board-wrap').style.width=(CANVAS_SIZE*scale+48)+'px';
  document.querySelector('.board-wrap').style.height=(CANVAS_SIZE*scale+80)+'px';
}
window.addEventListener('resize',scaleBoard);

// Init
initBoard(); updateTurn(); updateScores(); scaleBoard();
showOverlay('mode-overlay');

</script>
